<!DOCTYPE html>
<html lang="da">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title data-t="ui.titel">Standberegner — Wieben Design</title>
<meta name="description" content="Form jeres messestand og få et prisestimat, en sammensat løsning og en plan frem mod messedagen.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter+Tight:wght@600;700&family=Noto+Sans:wght@400;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/styles.css">
</head>
<body>

<header class="top">
  <div class="wrap top-inner">
    <div class="brand">
      <img src="assets/logo.png" alt="Wieben Design" data-t-alt="ui.logoAlt" class="logo">
      <span class="brand-sub" data-t="ui.brandSub"></span>
    </div>
    <div class="top-hoejre">
      <nav class="sprogvalg" id="sprogvalg" aria-label="Sprog / Language" hidden></nav>
      <p class="top-note" data-t="ui.prototype"></p>
    </div>
  </div>
</header>

<nav class="steps" id="steps" data-t-aria="ui.trinNav"></nav>

<main class="wrap" id="main">

  <!-- ============ TRIN 0: INTRO ============ -->
  <section class="step" data-step="0">
    <div class="hero">
      <p class="eyebrow" data-t="ui.heroEyebrow"></p>
      <h1 data-t="ui.heroTitel"></h1>
      <p class="lead" data-t="ui.heroLead"></p>
      <ul class="hero-list">
        <li data-t-html="ui.heroPunkt1"></li>
        <li data-t-html="ui.heroPunkt2"></li>
        <li data-t-html="ui.heroPunkt3"></li>
      </ul>
      <button class="btn btn-primary btn-lg" data-goto="1" data-t="ui.heroKnap"></button>
    </div>
  </section>

  <!-- ============ TRIN 1: PROFIL ============ -->
  <section class="step" data-step="1" hidden>
    <h2 class="step-title" data-t="ui.profilTitel"></h2>
    <p class="step-intro" data-t="ui.profilIntro"></p>
    <div id="profil"></div>

    <div class="nav-row">
      <button class="btn" data-goto="0" data-t="ui.tilbage"></button>
      <button class="btn btn-primary" data-goto="2" id="videre-profil" data-t="ui.videre"></button>
    </div>
  </section>

  <!-- ============ TRIN 2: STANDEN ============ -->
  <section class="step" data-step="2" hidden>
    <h2 class="step-title" data-t="ui.standenTitel"></h2>
    <div id="anbefaling" class="anbefaling"></div>

    <div class="field">
      <span class="field-label" data-t="ui.hvorMesse"></span>
      <div class="stedvalg">
        <div class="stedvalg-kol">
          <label for="land" data-t="ui.land"></label>
          <select id="land" class="select"></select>
        </div>
        <div class="stedvalg-kol">
          <label for="by" data-t="ui.by"></label>
          <select id="by" class="select"></select>
        </div>
        <div class="stedvalg-kol">
          <label for="messedato" data-t="ui.foersteDag"></label>
          <input type="date" id="messedato" class="select">
        </div>
      </div>
      <p class="field-hjaelp" id="by-hjaelp"></p>
      <div class="stedvalg-kol km-manuel" id="km-manuel" hidden>
        <label for="km" data-t="ui.hvorLangt"></label>
        <div class="field-row">
          <input type="number" id="km" class="select" min="0" step="10" data-t-placeholder="ui.kmEksempel" inputmode="numeric" autocomplete="off">
          <span class="enhed" data-t="ui.kmHverVej"></span>
        </div>
      </div>
    </div>

    <h3 class="grp-title" data-t="ui.stoerrelse"></h3>
    <div class="sliders">
      <div class="slider-box">
        <label for="m2" data-t="ui.areal"></label>
        <input type="range" id="m2" min="6" max="200" step="1" value="24">
        <output id="m2-ud">24 m²</output>
        <p class="field-hjaelp" id="m2-hjaelp"></p>
      </div>
      <div class="slider-box">
        <label for="dage" data-t="ui.messedage"></label>
        <input type="range" id="dage" min="1" max="8" step="1" value="3">
        <output id="dage-ud">3 dage</output>
      </div>
    </div>

    <h3 class="sp-title" data-t="ui.sider"></h3>
    <p class="grp-hjaelp" data-t="ui.siderHjaelp"></p>
    <div id="aabneSider" class="cards cards-4"></div>
    <p class="field-hjaelp" id="vaeg-hjaelp"></p>

    <h3 class="grp-title" data-t="ui.vaeggeGrafik"></h3>
    <div id="vaegtyper" class="cards cards-2"></div>
    <div class="valgrow">
      <div class="valgblok">
        <label class="field-label" for="vaeghoejde" data-t="ui.vaeghoejde"></label>
        <div class="seg" id="vaeghoejde"></div>
        <p class="field-hjaelp" id="hoejde-hjaelp"></p>
      </div>
      <div class="valgblok">
        <label class="field-label" data-t="ui.grafikdaekning"></label>
        <div class="seg" id="grafik"></div>
        <p class="field-hjaelp" id="grafik-hjaelp"></p>
      </div>
    </div>

    <div id="grafikarbejde-blok">
      <h3 class="sp-title" data-t="ui.grafikTitel"></h3>
      <p class="grp-hjaelp" data-t="ui.grafikHjaelp"></p>
      <div id="grafikarbejde" class="cards cards-3"></div>
    </div>

    <h3 class="grp-title" data-t="ui.gulv"></h3>
    <div id="gulv" class="cards cards-3"></div>
    <h3 class="sp-title" data-t="ui.haevetTitel"></h3>
    <p class="grp-hjaelp" data-t="ui.haevetHjaelp"></p>
    <div id="haevet" class="cards cards-2"></div>

    <h3 class="grp-title" data-t="ui.belysning"></h3>
    <div id="belysning" class="cards cards-3"></div>

    <div id="indsigter-2" class="indsigter"></div>

    <div class="nav-row">
      <button class="btn" data-goto="1" data-t="ui.tilbage"></button>
      <button class="btn btn-primary" data-goto="3" data-t="ui.videreInventar"></button>
    </div>
  </section>

  <!-- ============ TRIN 3: OMRÅDER ============ -->
  <section class="step" data-step="3" hidden>
    <h2 class="step-title" data-t="ui.omraaderTitel"></h2>
    <p class="step-intro" data-t="ui.omraaderIntro"></p>
    <p class="forbehold" data-t="ui.omraaderForbehold"></p>
    <div id="startvalg" class="startvalg"></div>

    <div id="omraadedel" hidden>
      <div id="omraader"></div>
      <p class="field-hjaelp" id="areal-hjaelp"></p>

      <h3 class="sp-title" data-t="ui.tilkoebTitel"></h3>
      <div id="tilkoeb" class="cards cards-4"></div>
    </div>
    <div id="led-valg" class="ledvalg" hidden>
      <h4 data-t="ui.ledTitel"></h4>
      <p class="grp-hjaelp" id="led-intro"></p>
      <div id="led-stoerrelser" class="cards cards-4"></div>
    </div>

    <div id="indsigter-3" class="indsigter"></div>
    <div class="nav-row">
      <button class="btn" data-goto="2" data-t="ui.tilbage"></button>
      <button class="btn btn-primary" data-goto="4" id="videre-omraader" data-t="ui.viderePlanen"></button>
    </div>
  </section>

  <!-- ============ TRIN 4: MESSEKLAR ============ -->
  <section class="step" data-step="4" hidden>
    <h2 class="step-title" data-t="ui.messeklarTitel"></h2>
    <p class="step-intro" data-t="ui.messeklarIntro"></p>
    <p class="forbehold" data-t="ui.messeklarForbehold"></p>
    <div id="budget" class="budget"></div>
    <div id="samlet" class="samlet"></div>
    <h3 class="grp-title" data-t="ui.tidslinjeTitel"></h3>
    <p class="grp-hjaelp" id="tidslinje-intro"></p>
    <div id="tidslinje" class="tidslinje"></div>
    <div class="nav-row">
      <button class="btn" data-goto="3" data-t="ui.tilbage"></button>
      <button class="btn btn-primary" data-goto="5" data-t="ui.seOpsummering"></button>
    </div>
  </section>

  <!-- ============ TRIN 5: OPLÆG ============ -->
  <section class="step" data-step="5" hidden>
    <h2 class="step-title" data-t="ui.oplaegTitel"></h2>
    <div id="opsummering" class="opsummering"></div>

    <form id="kontakt" class="kontakt" novalidate>
      <h3 data-t="ui.formTitel"></h3>
      <p data-t="ui.formIntro"></p>
      <div class="form-grid">
        <label><span data-t="ui.navn"></span><input type="text" name="navn" required></label>
        <label><span data-t="ui.virksomhed"></span><input type="text" name="virksomhed" required></label>
        <label><span data-t="ui.email"></span><input type="email" name="email" required></label>
        <label><span data-t="ui.telefon"></span><input type="tel" name="telefon"></label>
        <label class="full"><span><span data-t="ui.budgetLabel"></span> <span class="valgfri-mrk" data-t="ui.valgfrit"></span></span>
          <select name="budget" id="budgetramme">
            <option value="" data-t="ui.budgetTom"></option>
            <option data-t="ui.budget1"></option>
            <option data-t="ui.budget2"></option>
            <option data-t="ui.budget3"></option>
            <option data-t="ui.budget4"></option>
            <option data-t="ui.budget5"></option>
          </select>
        </label>
        <label class="full"><span data-t="ui.besked"></span><textarea name="besked" rows="3"></textarea></label>
      </div>
      <p class="samtykke"><span class="samtykke-mrk" data-t="ui.samtykkeMrk"></span> <span data-t-html="ui.samtykke"></span></p>
      <p class="persondata" data-t-html="ui.persondata"></p>
      <div class="form-row">
        <button type="submit" class="btn btn-primary btn-lg" data-t="ui.sendKnap"></button>
      </div>
      <p class="alternativer"><span data-t="ui.selvFoerst"></span>
        <button type="button" class="btn btn-tekst" id="print" data-t="send.hentPdf"></button>
      </p>
      <p class="disclaimer" id="prototypenote" hidden data-t="ui.prototypeNote"></p>
    </form>

    <!-- "Start forfra" sletter alt og hører derfor til navigationen,
         ikke ved siden af en harmløs download. Den ligger uden for
         formularen, så den også er der, når kvitteringen har afløst den. -->
    <div class="nav-row">
      <button class="btn" data-goto="4" data-t="ui.tilbage"></button>
      <button type="button" class="btn btn-tekst" id="nulstil" data-t="ui.startForfra"></button>
    </div>
  </section>

</main>

<!-- ============ PRISBJÆLKE ============ -->
<div class="prisbar" id="prisbar" hidden>
  <div class="wrap prisbar-inner">
    <div class="prisbar-tal">
      <span class="prisbar-label" data-t="ui.prisbarLabel"></span>
      <strong id="prisbar-belob" aria-live="polite" aria-atomic="true">—</strong>
      <span class="prisbar-note" data-t="ui.prisbarNote"></span>
    </div>
    <button class="btn btn-ghost" id="prisbar-toggle" aria-expanded="false" data-t="prisbar.seSpec"></button>
  </div>
  <div class="prisbar-detalje wrap" id="prisbar-detalje" hidden></div>
</div>

<!-- ============ PDF-ARK — vises kun ved print ============ -->
<section id="printark" aria-hidden="true">
  <header class="pa-top">
    <img src="assets/logo.png" alt="Wieben Design" data-t-alt="ui.logoAlt">
    <div class="pa-top-tekst">
      <h1 data-t="ui.arkTitel"></h1>
      <p id="pa-undertitel"></p>
    </div>
  </header>
  <section class="pa-blok">
    <h2 data-t="ui.arkStanden"></h2>
    <dl id="pa-konfiguration" class="pa-liste"></dl>
  </section>
  <section class="pa-blok">
    <h2 data-t="ui.arkPris"></h2>
    <table id="pa-pris" class="pa-tabel"></table>
    <p class="pa-note" data-t="ui.arkNote"></p>
  </section>
  <section class="pa-blok pa-bryd">
    <h2 data-t="ui.arkFrem"></h2>
    <p class="pa-note" id="pa-tidslinje-intro"></p>
    <table id="pa-tidslinje" class="pa-tabel"></table>
  </section>
  <footer class="pa-bund">
    <p><strong data-t="ui.firma"></strong> <span data-t="ui.adresse"></span></p>
    <p data-t="ui.arkFod"></p>
  </footer>
</section>

<footer class="bund">
  <div class="wrap">
    <p><strong data-t="ui.firma"></strong> <span data-t="ui.bundAdresse"></span></p>
    <p class="disclaimer" data-t-html="ui.bundNote"></p>
  </div>
</footer>

<script src="assets/config.js"></script>
<script src="assets/data.js"></script>
<script src="assets/tekst-da.js"></script>
<script src="assets/indhold-da.js"></script>
<script src="assets/tekst-en.js"></script>
<script src="assets/indhold-en.js"></script>
<script src="assets/pricing.js"></script>
<script src="assets/app.js"></script>
</body>
</html>
